name: Software and protocol checks
on:
  push:
    branches: [main]
    paths: ['software/**', 'firmware/**', 'tools/**', '.github/workflows/software.yml']
  pull_request:
    paths: ['software/**', 'firmware/**', 'tools/**', '.github/workflows/software.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install --yes libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r software/requirements-dev.lock -r software/requirements-desktop.lock
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.5.1'
      - run: arduino-cli core install arduino:avr@1.8.8
      - run: arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - run: python tools/verify.py --profile desktop --require-esp32 --sanitizers undefined --output evidence/verification/ci-desktop
      - run: python tools/portable_checks.py --rounds 3 --output evidence/verification/ci-portable
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: software-verification
          path: evidence/verification/ci-*
