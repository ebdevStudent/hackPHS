[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ball-drone-demo"
version = "0.1.0"
description = "Offline vision and yaw demonstration; no transmitter output"
requires-python = ">=3.13"
dependencies = ["fastapi", "uvicorn", "opencv-python-headless", "numpy", "pyserial", "qrcode", "pillow"]

[project.optional-dependencies]
desktop = ["PySide6-Essentials==6.9.3"]
d435 = ["pyrealsense2==2.58.4.10922"]

[project.scripts]
ball-demo = "ball_demo.cli:main"
ball-desktop = "ball_demo.desktop:main"
ball-room-mapper = "ball_demo.room_mapper:main"

[tool.setuptools]
packages = ["ball_demo"]

[tool.setuptools.package-data]
ball_demo = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
parallel = true
concurrency = ["thread", "multiprocessing"]
patch = ["subprocess", "_exit"]
sigterm = true

[tool.coverage.report]
show_missing = true
